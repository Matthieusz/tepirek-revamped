name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Checks and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          # Keep aligned with mise.toml; pnpm comes from packageManager.
          runtime: node@26.10.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting and lint
        run: pnpm check

      - name: Unused-code check
        run: pnpm check:unused

      - name: Typecheck
        run: pnpm check-types

      - name: Build
        run: pnpm build

  tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          # Keep aligned with mise.toml; pnpm comes from packageManager.
          runtime: node@26.10.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  integration:
    name: Smoke and API integration tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tepirek_revamped_test
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v3
        with:
          # Keep aligned with mise.toml; pnpm comes from packageManager.
          runtime: node@26.10.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Smoke tests manage their own isolated container and reuse the pulled image.
      - name: Smoke tests
        run: pnpm test:smoke

      - name: API integration tests
        run: pnpm test:integration
        env:
          API_INTEGRATION_ALLOW_DATABASE_RESET: "1"
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/tepirek_revamped_test

  verify:
    name: Verify
    if: ${{ always() }}
    needs: [checks, tests, integration]
    runs-on: ubuntu-latest

    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success"
