name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: tepirek_revamped_test
          POSTGRES_PASSWORD: password
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js and Nub
        uses: nubjs/setup-nub@v0
        with:
          nub-version: 0.8.3
          node-version: 24
          cache: true
          cache-dependency-path: nub.lock

      - name: Install dependencies
        run: nub ci

      - name: Check formatting and lint
        run: nub run check

      - name: Unused-code check
        run: nub run check:unused

      - name: Typecheck
        run: nub run check-types

      - name: Test
        run: nub run test

      - name: Smoke tests
        run: nub run test:smoke

      - name: API integration tests
        run: nub run test:integration
        env:
          API_INTEGRATION_ALLOW_DATABASE_RESET: "1"
          TEST_DATABASE_URL: postgresql://postgres:password@localhost:5432/tepirek_revamped_test

      - name: Build
        run: nub run build
