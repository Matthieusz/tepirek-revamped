name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Supersede PR runs, but never cancel or group production runs together.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    uses: ./.github/workflows/build.yml

  tests:
    uses: ./.github/workflows/tests.yml

  verify:
    name: Verify
    if: ${{ always() }}
    needs: [checks, build, tests]
    runs-on: ubuntu-latest

    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: test "$RESULTS" = "success success success"

  deploy:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_API_APP_ID: ${{ secrets.DOKPLOY_API_APP_ID }}
      DOKPLOY_WEB_APP_ID: ${{ secrets.DOKPLOY_WEB_APP_ID }}
