  - "@effect/tsgo-linux-x64@0.57.0"
  - "@effect/tsgo-win32-arm64@0.57.0"
  - "@effect/tsgo-win32-x64@0.57.0"
  - "tsrs@0.18.0-ts7.1.0-dev.20260929"
  - "@tsrs/darwin-arm64@0.18.0-ts7.1.0-dev.20260929"
  - "@tsrs/linux-arm64-gnu@0.18.0-ts7.1.0-dev.20260929"
