  dotenv: ^18.0.9
  "@effect/sql-pg": 4.1.0
  "@effect/vitest": 4.1.0
  "@types/pg": 8.23.1
  drizzle-kit: 1.0.0-rc.5-5935859
  drizzle-orm: 1.0.0-rc.5-5935859
  effect: 4.1.0
  hono: ^4.13.14
  pg: 8.23.1
  typescript: 7.0.2
  vitest: 5.0.5
  zod: ^4.6.7
  linkedom: ^0.18.14

minimumReleaseAgeExclude:
  - "@effect/platform-node-shared@4.1.0"
  - "@effect/platform-node@4.1.0"
  - "@effect/sql-pg@4.1.0"
  - "@effect/vitest@4.1.0"
  - "@types/node@26.6.6"
  - effect@4.1.0
  - lucide-react@1.64.0
  - cn@0.2.4
  - "@vitest/mocker@5.0.0"
  - "@vitest/spy@5.0.0"
  - vitest@5.0.0
  - "@effect/platform-node-shared@4.0.0"
  - "@effect/platform-node@4.0.0"
  - "@effect/sql-pg@4.0.0"
  - "@effect/vitest@4.0.0"
  - effect@4.0.0
  - "@voidzero-dev/vite-plus-core@1.2.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.2.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.2.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.2.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.2.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.2.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.2.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.2.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.2.0"
  - vite-plus@1.2.0
  - "@effect/tsgo@0.57.0"
  - "@effect/tsgo-darwin-arm64@0.57.0"
  - "@effect/tsgo-darwin-x64@0.57.0"
