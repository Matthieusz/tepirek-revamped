  - "@tsrs/linux-x64-musl@0.18.0-ts7.1.0-dev.20260929"

onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest@*: 5.0.5

peerDependencyRules:
  allowedVersions:
    # Vite+ implements Vite's API but publishes its own version, not Vite's 8.x.
    # Upstream also allows this alias; restrict acceptance to our exact toolchain.
    vite: 1.3.0

patchedDependencies:
  drizzle-orm@1.0.0-rc.5-5935859: patches/drizzle-orm@1.0.0-rc.5-5935859.patch
