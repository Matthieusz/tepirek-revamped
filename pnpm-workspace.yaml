packages:
  - apps/*
  - packages/*

allowBuilds:
  esbuild: true
  msgpackr-extract: true

catalog:
  better-auth: ^1.7.12
  dotenv: ^18.0.8
  "@effect/sql-pg": 4.0.3
  "@effect/vitest": 4.0.3
  "@types/pg": 8.23.1
  drizzle-kit: 1.0.0-rc.5
  drizzle-orm: 1.0.0-rc.5
  effect: 4.0.3
  hono: ^4.13.13
  pg: 8.23.1
  typescript: 7.0.2
  vitest: 5.0.4
  zod: ^4.6.7
  linkedom: ^0.18.14

minimumReleaseAgeExclude:
  - cn@0.2.4
  - "@vitest/mocker@5.0.0"
  - "@vitest/spy@5.0.0"
  - vitest@5.0.0
  - "@effect/platform-node-shared@4.0.0"
  - "@effect/platform-node@4.0.0"
  - "@effect/sql-pg@4.0.0"
  - "@effect/vitest@4.0.0"
  - effect@4.0.0
  - "@voidzero-dev/vite-plus-core@1.2.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.2.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.2.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.2.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.2.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.2.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.2.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.2.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.2.0"
  - vite-plus@1.2.0
  - drizzle-kit@1.0.0-rc.5
  - drizzle-orm@1.0.0-rc.5

onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.2.0
  vitest@*: 5.0.4

patchedDependencies:
  drizzle-orm@1.0.0-rc.5: patches/drizzle-orm@1.0.0-rc.5.patch
